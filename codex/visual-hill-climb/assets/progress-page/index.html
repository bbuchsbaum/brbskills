<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hill climb</title>
<style>
:root {
  --ground: #e8e9ec;
  --panel: #f6f6f7;
  --panel-2: #eef0f2;
  --ink: #16181d;
  --muted: #5d6470;
  --line: #d3d6dc;
  --lapis: #2848c4;
  --ochre: #d99a00;
  --red: #c4321f;
  --good: #1f7a4a;
  --bad: #b2331f;
  --heat-lo: #f1dcd6;
  --heat-hi: #1f4fb8;
  --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif: "Newsreader", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111317; --panel: #191c21; --panel-2: #1f232a; --ink: #e9e7e2; --muted: #9aa2ae;
    --line: #2d323b; --lapis: #8ea4ff; --ochre: #f0b429; --red: #ff8a73; --good: #6fd19b; --bad: #ff8a73;
    --heat-lo: #3a2622; --heat-hi: #6f8dff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #111317; --panel: #191c21; --panel-2: #1f232a; --ink: #e9e7e2; --muted: #9aa2ae;
  --line: #2d323b; --lapis: #8ea4ff; --ochre: #f0b429; --red: #ff8a73; --good: #6fd19b; --bad: #ff8a73;
  --heat-lo: #3a2622; --heat-hi: #6f8dff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--sans); margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 80px; display: grid; gap: 28px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--mono); }

/* masthead */
.mast { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.sq { width: 64px; height: 64px; background: var(--ochre); display: grid; place-items: center; }
.sq i { width: 42px; height: 42px; background: var(--red); display: grid; place-items: center; }
.sq i::after { content: ""; width: 20px; height: 20px; background: var(--lapis); }
.mast h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.mast p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
.status { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 13px; }
.pill { font: 500 12px/1 var(--mono); padding: 6px 9px; background: var(--panel); border: 1px solid var(--line); }
.pill b { color: var(--lapis); font-weight: 500; }
.live::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--ochre); margin-right: 7px; animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }

.panel { background: var(--panel); border: 1px solid var(--line); padding: 20px; min-width: 0; }
.eyebrow { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
.eyebrow::before { content: ""; width: 7px; height: 7px; background: var(--lapis); box-shadow: 0 0 0 2px var(--ochre); margin: 2px; }

/* scores */
.scores { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .scores { grid-template-columns: 1fr; } }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--c); }
.heat { overflow-x: auto; }
.heat table { border-collapse: collapse; font: 12px var(--mono); font-variant-numeric: tabular-nums; width: 100%; }
.heat th { font: 600 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 4px 6px; white-space: nowrap; }
.heat td { text-align: center; padding: 6px 4px; min-width: 38px; border: 2px solid var(--panel); }
.heat td.dim { text-align: left; font-family: var(--sans); color: var(--ink); white-space: nowrap; }
.delta-up { color: var(--good); } .delta-dn { color: var(--bad); }

/* compare */
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; margin-bottom: 14px; }
.controls label { display: grid; gap: 4px; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
select, .seg button { font: 500 13px var(--sans); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); padding: 7px 10px; }
select:focus-visible, .seg button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
.seg { display: flex; }
.seg button { cursor: pointer; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.shots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.shots button { font: 500 12px var(--sans); padding: 6px 10px; background: transparent; color: var(--muted); border: 1px solid var(--line); cursor: pointer; }
.shots button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--panel-2); }
.slider { position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); user-select: none; touch-action: pan-y; max-width: 100%; }
.slider img { display: block; width: 100%; height: auto; }
.slider .after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos, 50%)); }
.slider .after img { width: 100%; }
.slider .bar { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; background: var(--ochre); transform: translateX(-1px); pointer-events: none; }
.slider .bar::after { content: ""; position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); background: var(--ochre); box-shadow: 0 0 0 5px var(--red); }
.slider .tag { position: absolute; top: 10px; font: 500 11px var(--mono); padding: 4px 7px; background: var(--ink); color: var(--panel); }
.slider .tag.l { left: 10px; } .slider .tag.r { right: 10px; }
.slider input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side figure { margin: 0; min-width: 0; }
.side figcaption { font: 500 11px var(--mono); color: var(--muted); margin-bottom: 6px; }
.side .scroll { max-height: 80vh; overflow: auto; border: 1px solid var(--line); background: var(--panel-2); }
.side img { display: block; width: 100%; height: auto; }
.side.narrow { max-width: 820px; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

/* rounds */
.rounds { display: grid; gap: 16px; }
.round { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .round { grid-template-columns: 1fr; } }
.round .meta h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.round .meta .mono { font-size: 12px; color: var(--muted); }
.round .avg { font: 500 30px/1 var(--mono); margin-top: 10px; }
.round .avg small { font-size: 12px; color: var(--muted); display: block; margin-top: 4px; }
.round p.sum { margin: 0 0 10px; font: 17px/1.5 var(--serif); max-width: 72ch; }
.round ul.changes { margin: 0 0 12px; padding-left: 18px; max-width: 80ch; }
.round ul.changes li { margin: 3px 0; }
details { border-top: 1px solid var(--line); }
details:last-child { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; padding: 10px 0; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--mono); color: var(--muted); }
details[open] summary::after { content: "−"; }
.md { font-size: 14px; max-width: 86ch; padding-bottom: 14px; overflow-wrap: anywhere; }
.md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.md code { font: 12.5px var(--mono); background: var(--panel-2); padding: 1px 4px; }
.md pre { background: var(--panel-2); padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.slider:focus-within { outline: 3px solid var(--lapis); outline-offset: 3px; }
@media (max-width: 540px) { .side { grid-template-columns: 1fr; } .wrap { padding-inline: 12px; } .panel { padding: 14px; } }
.md pre code { background: none; padding: 0; }
.md h2 { font-size: 16px; margin: 18px 0 8px; }
.md h3 { font-size: 14px; margin: 14px 0 6px; }
a { color: var(--lapis); }
.empty { color: var(--muted); font-style: italic; }
</style>

<div class="wrap">
  <header class="mast">
    <div class="sq" aria-hidden="true"><i></i></div>
    <div>
      <h1 id="page-title">Hill climb</h1>
      <p id="page-intro">Each round renders a fixed specimen, collects scored critiques from independent reviewers, then applies the changes that move the scores.</p>
    </div>
  </header>
  <div class="status" id="status"></div>

  <section class="panel" aria-labelledby="h-scores">
    <div class="eyebrow" id="h-scores">Scores by round</div>
    <div class="scores">
      <div class="chart" id="chart"></div>
      <div class="heat" id="heat"></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-compare">
    <div class="eyebrow" id="h-compare">Before / after</div>
    <div class="controls">
      <label for="left">Before<select id="left"></select></label>
      <label for="right">After<select id="right"></select></label>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="mode-slide" aria-pressed="true">Slider · first screen</button>
        <button type="button" id="mode-full" aria-pressed="false">Side by side · full page</button>
      </div>
    </div>
    <div class="shots" id="shots" role="group" aria-label="Page"></div>
    <div id="stage"></div>
  </section>

  <section aria-labelledby="h-rounds">
    <div class="eyebrow" id="h-rounds">Rounds</div>
    <div class="rounds" id="rounds"></div>
  </section>
</div>

<script src="data.js"></script>
<script>
(function () {
  var DIMS = ["typography","color","layout","code","data","components","function","dark","mobile","identity"];
  var CRITIC_COLORS = ["var(--lapis)", "var(--red)", "var(--ochre)", "var(--good)", "var(--muted)"];
  var state = { shot: null, mode: "slide", left: null, right: null, pos: 50 };
  var data;

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function escapeHTML(value) { return String(value).replace(/[&<>"']/g, function (c) { return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]; }); }
  function mean(a) { a = a.filter(function (x) { return typeof x === "number"; }); return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; }
  function roundMean(r) {
    if (!r || !r.complete) return null;
    var all = [];
    Object.keys(r.scores || {}).forEach(function (c) { DIMS.forEach(function (d) { if (typeof r.scores[c][d] === "number") all.push(r.scores[c][d]); }); });
    return mean(all);
  }
  function dimMean(r, d) { if (!r.complete) return null; return mean(Object.keys(r.scores || {}).map(function (c) { return r.scores[c][d]; })); }
  function critics() {
    var s = {};
    data.rounds.forEach(function (r) { Object.keys(r.scores || {}).forEach(function (c) { s[c] = 1; }); });
    return Object.keys(s);
  }

  function renderStatus() {
    var box = document.getElementById("status");
    box.innerHTML = "";
    box.appendChild(el("span", { class: "pill live", text: data.status }));
    box.appendChild(el("span", { class: "pill", html: "rounds <b>" + data.rounds.length + "</b>" }));
    var last = data.rounds[data.rounds.length - 1], first = data.rounds[0];
    var a = roundMean(first), b = roundMean(last);
    if (a != null && b != null) box.appendChild(el("span", { class: "pill", html: "mean score <b>" + a.toFixed(2) + " → " + b.toFixed(2) + "</b>" }));
    box.appendChild(el("span", { class: "pill", text: "updated " + data.updated }));
  }

  function renderChart() {
    var W = 560, H = 250, L = 34, R = 14, T = 12, B = 30;
    var rs = data.rounds, cs = critics();
    var x = function (i) { return L + (rs.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (rs.length - 1)); };
    var y = function (v) { return T + (10 - v) * (H - T - B) / 9; }; // full rubric axis 1..10
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Mean score per critic by round">';
    for (var v = 1; v <= 10; v++) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>';
      s += '<text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    }
    rs.forEach(function (r, i) { s += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + escapeHTML(r.id) + '</text>'; });
    var series = cs.map(function (c, ci) {
      return { name: c, color: CRITIC_COLORS[ci % CRITIC_COLORS.length], pts: rs.map(function (r, i) { var m = r.scores && r.scores[c] ? mean(DIMS.map(function (d) { return r.scores[c][d]; })) : null; return m == null ? null : [x(i), y(m), m]; }) };
    });
    series.push({ name: "mean", color: "var(--ink)", bold: true, pts: rs.map(function (r, i) { var m = roundMean(r); return m == null ? null : [x(i), y(m), m]; }) });
    series.forEach(function (se) {
      var pts = se.pts.filter(Boolean);
      if (pts.length > 1 && pts.length === se.pts.length) s += '<polyline fill="none" stroke="' + se.color + '" stroke-width="' + (se.bold ? 3 : 1.6) + '" points="' + pts.map(function (p) { return p[0] + "," + p[1]; }).join(" ") + '"/>';
      pts.forEach(function (p, k) {
        var sz = se.bold ? 7 : 5;
        s += '<rect x="' + (p[0] - sz / 2) + '" y="' + (p[1] - sz / 2) + '" width="' + sz + '" height="' + sz + '" fill="' + se.color + '"><title>' + escapeHTML(se.name) + ': ' + p[2].toFixed(2) + '</title></rect>';
        if (se.bold && k === pts.length - 1) s += '<text x="' + (p[0] - 8) + '" y="' + (p[1] - 10) + '" text-anchor="end" style="fill:var(--ink);font-weight:500">' + p[2].toFixed(2) + '</text>';
      });
    });
    s += "</svg>";
    var box = document.getElementById("chart");
    box.innerHTML = s;
    var lg = el("div", { class: "legend" });
    series.forEach(function (se) { var sp = el("span", { text: se.name }); sp.style.setProperty("--c", se.color); lg.appendChild(sp); });
    box.appendChild(lg);
  }

  function heatColor(v) {
    if (v == null) return "transparent";
    var t = Math.max(0, Math.min(1, (v - 1) / 9));
    return "color-mix(in oklab, var(--heat-hi) " + Math.round(t * 100) + "%, var(--heat-lo))";
  }
  function renderHeat() {
    var rs = data.rounds;
    var t = '<table><thead><tr><th>dimension</th>' + rs.map(function (r) { return "<th>" + escapeHTML(r.id) + "</th>"; }).join("") + "<th>Δ</th></tr></thead><tbody>";
    DIMS.forEach(function (d) {
      t += '<tr><td class="dim">' + escapeHTML(d) + "</td>";
      var vals = rs.map(function (r) { return dimMean(r, d); });
      vals.forEach(function (v) {
        var dark = v != null && v >= 6.5;
        t += '<td style="background:' + heatColor(v) + ';color:' + (dark ? "#fff" : "var(--ink)") + '">' + (v == null ? "·" : v.toFixed(1)) + "</td>";
      });
      var f = vals[0], l = vals[vals.length - 1];
      var dv = f != null && l != null ? l - f : null;
      t += '<td class="' + (dv > 0 ? "delta-up" : dv < 0 ? "delta-dn" : "") + '">' + (dv == null || rs.length < 2 ? "" : (dv > 0 ? "+" : "") + dv.toFixed(1)) + "</td></tr>";
    });
    t += "</tbody></table>";
    document.getElementById("heat").innerHTML = t;
  }

  function imgPath(round, shot, kind) { return "img/" + round + "/" + shot + "-" + kind + ".png"; }
  function roundsWithImages() { return data.rounds.filter(function (r) { return r.images === true; }); }

  function renderControls() {
    var rs = roundsWithImages();
    ["left", "right"].forEach(function (side) {
      var s = document.getElementById(side);
      s.innerHTML = "";
      rs.forEach(function (r) { s.appendChild(el("option", { value: r.id, text: r.id + " · " + r.title })); });
    });
    if (!rs.length || !data.shots.length) { state.left = null; state.right = null; return; }
    if (!state.left || !rs.some(function (r) { return r.id === state.left; })) state.left = rs[0].id;
    if (!state.right || !rs.some(function (r) { return r.id === state.right; })) state.right = rs[rs.length - 1].id;
    document.getElementById("left").value = state.left;
    document.getElementById("right").value = state.right;
    var box = document.getElementById("shots");
    box.innerHTML = "";
    if (!state.shot) state.shot = data.shots[0].id;
    data.shots.forEach(function (sh) {
      var b = el("button", { type: "button", "aria-pressed": String(sh.id === state.shot), text: sh.label });
      b.addEventListener("click", function () { state.shot = sh.id; renderControls(); renderStage(); });
      box.appendChild(b);
    });
  }

  function renderStage() {
    var st = document.getElementById("stage");
    st.innerHTML = "";
    if (!state.left || !state.right || !state.shot) { st.appendChild(el("p", { class: "empty", text: "No complete image sets recorded yet." })); return; }
    var shot = data.shots.find(function (s) { return s.id === state.shot; });
    var narrow = /mobile/.test(state.shot);
    if (state.mode === "slide") {
      var sl = el("div", { class: "slider" });
      if (narrow) { sl.style.maxWidth = "420px"; }
      sl.style.setProperty("--pos", state.pos + "%");
      sl.appendChild(el("img", { src: imgPath(state.left, state.shot, "fold"), alt: shot.label + " before (" + state.left + ")" }));
      var after = el("div", { class: "after" }, [el("img", { src: imgPath(state.right, state.shot, "fold"), alt: shot.label + " after (" + state.right + ")" })]);
      sl.appendChild(after);
      sl.appendChild(el("div", { class: "bar" }));
      sl.appendChild(el("span", { class: "tag l", text: state.left }));
      sl.appendChild(el("span", { class: "tag r", text: state.right }));
      var inp = el("input", { type: "range", min: "0", max: "100", value: String(state.pos), id: "pos", "aria-label": "Reveal after image" });
      inp.addEventListener("input", function () { state.pos = +inp.value; sl.style.setProperty("--pos", state.pos + "%"); });
      sl.appendChild(inp);
      st.appendChild(sl);
      st.appendChild(el("p", { class: "note", text: "Drag across the image: left of the bar is " + state.left + ", right of the bar is " + state.right + "." + ((data.meta && data.meta.captureNote) ? " " + data.meta.captureNote : "") }));
    } else {
      var side = el("div", { class: "side" + (narrow ? " narrow" : "") });
      [state.left, state.right].forEach(function (rid) {
        side.appendChild(el("figure", {}, [el("figcaption", { text: rid }), el("div", { class: "scroll" }, [el("img", { src: imgPath(rid, state.shot, "full"), alt: shot.label + " full page (" + rid + ")", loading: "lazy" })])]));
      });
      st.appendChild(side);
    }
  }

  function renderRounds() {
    var box = document.getElementById("rounds");
    box.innerHTML = "";
    data.rounds.slice().reverse().forEach(function (r) {
      var m = roundMean(r);
      var meta = el("div", { class: "meta" }, [
        el("h3", { text: r.id }),
        el("div", { class: "mono", text: r.title }),
        el("div", { class: "mono", text: r.date || "" }),
        m != null ? el("div", { class: "avg", html: m.toFixed(2) + "<small>mean of complete critic scores</small>" }) : null
      ]);
      if (!r.complete) meta.appendChild(el("p", { class: "empty", text: "Review pending: " + (r.pending || []).join(", ") }));
      var body = el("div", {}, [
        r.summary ? el("p", { class: "sum", text: r.summary }) : null,
      ]);
      if (r.changes && r.changes.length) {
        var ul = el("ul", { class: "changes" });
        r.changes.forEach(function (c) { ul.appendChild(el("li", { text: c })); });
        body.appendChild(ul);
      }
      (r.critiques || []).forEach(function (c) {
        var det = el("details", {}, [el("summary", { text: c.critic + (c.note ? " — " + c.note : "") })]);
        var md = el("div", { class: "md" }, [el("pre", { text: c.text || "Critique text unavailable." })]);
        det.appendChild(md);
        body.appendChild(det);
      });
      box.appendChild(el("article", { class: "panel round" }, [meta, body]));
    });
  }

  function wire() {
    document.getElementById("left").addEventListener("change", function (e) { state.left = e.target.value; renderStage(); });
    document.getElementById("right").addEventListener("change", function (e) { state.right = e.target.value; renderStage(); });
    ["slide", "full"].forEach(function (m) {
      document.getElementById("mode-" + m).addEventListener("click", function () {
        state.mode = m;
        document.getElementById("mode-slide").setAttribute("aria-pressed", String(m === "slide"));
        document.getElementById("mode-full").setAttribute("aria-pressed", String(m === "full"));
        renderStage();
      });
    });
  }

  function boot(d) {
    data = d;
    // project identity and rubric dimensions come from data.json "meta"
    var meta = d.meta || {};
    if (meta.dims && meta.dims.length) DIMS = meta.dims;
    if (meta.title) { document.getElementById("page-title").textContent = meta.title; document.title = meta.title; }
    if (meta.intro) document.getElementById("page-intro").textContent = meta.intro;
    renderStatus(); renderChart(); renderHeat(); renderControls(); renderStage(); renderRounds();
  }
  wire();
  // Single-writer helper embeds data and critiques; no network or file fetch needed.
  if (window.HILLCLIMB_DATA) boot(window.HILLCLIMB_DATA);
  else document.getElementById("status").textContent = "No round data yet. Run update_data.py, then reload this page.";
})();
</script>
