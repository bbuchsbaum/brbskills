    if (d.kind === "fmriprep") { const ok = d.confounds.filter(x => x.state === "present").length; tiles.append(tile(frac(ok, d.confounds.length), "confound files fetched"), tile(String(d.reports.length), "subject reports")); }
    else if (d.kind === "mriqc") { tiles.append(tile(fmt((d.iqms || []).length), "BOLD IQM rows"), tile(fmt((d.iqms_anat || []).length), "T1w IQM rows"), tile(fmt(d.reports.length), "HTML reports")); }
    else if (d.reports.length) tiles.append(tile(String(d.reports.length), "HTML reports"));
    c.append(tiles);
    if (Object.keys(d.spaces).length) c.append(h("h3", { text: "Output spaces", style: "margin-top:14px" }), h("div", { class: "chips" }, ...Object.entries(d.spaces).sort((a, b) => b[1] - a[1]).map(([k, v]) => h("span", { class: "chip" }, h("b", { text: k }), ` ${v} files`))));
    if ((d.group_reports || []).length) c.append(h("div", { class: "chips", style: "margin-top:14px" }, ...d.group_reports.map(g => h("a", { class: "btn", href: (d.report_links || {})[g] || g, target: "_blank", rel: "noopener", text: g.replace(".html", "") + " ↗" }))));
    if (d.reports.length) {
      const links = h("div", { class: "chips", style: "max-height:160px;overflow:auto;margin-top:8px" });
      for (const r of d.reports) links.append(h("a", { class: "chip", href: (d.report_links || {})[r] || r, target: "_blank", rel: "noopener", text: r.replace(".html", "") }));
      const empty = d.reports_empty || 0;
      c.append(h("details", { style: "margin-top:12px" }, h("summary", { text: `${plural(d.reports.length, "HTML report")}${empty ? ` · ${empty === d.reports.length ? "all" : empty} zero-byte placeholders (not fetched)` : ""}` }), links));
    }
    if (d.citation) c.append(h("details", { style: "margin-top:12px" }, h("summary", { text: "Methods boilerplate (CITATION)" }), h("pre", { class: "readme open", text: d.citation })));
    el.append(c);
  }
}

// ------------------------------------------------------------------ files
function buildFiles(el) {
  const ext = Object.entries(M.extensions || {}).sort((a, b) => b[1] - a[1]);
  const a = h("div", { class: "card" }, h("h3", { text: "Top level" }));
  const tree = Object.entries(M.tree || {});
  const subs = tree.filter(([k]) => /^sub-/.test(k)), rest = tree.filter(([k]) => !/^sub-/.test(k));
  const rows = [...(subs.length ? [[`sub-* (${subs.length} folders)`, subs.reduce((x, [, v]) => x + v, 0)]] : []), ...rest].sort((x, y) => y[1] - x[1]).slice(0, 16);
  const mx = Math.max(1, ...rows.map(x => x[1]));
  for (const [k, v] of rows) a.append(h("div", { class: "bar-row" }, h("span", { class: "lab mono", text: k }), h("div", { class: "track" }, h("div", { class: "fill", style: `width:${100 * v / mx}%` })), h("span", { class: "val", text: fmt(v) })));
  const b = h("div", { class: "card" }, h("h3", { text: "Extensions" }));
  const mx2 = Math.max(1, ...ext.map(x => x[1]));
  for (const [k, v] of ext.slice(0, 14)) b.append(h("div", { class: "bar-row" }, h("span", { class: "lab mono", text: k }), h("div", { class: "track" }, h("div", { class: "fill", style: `width:${100 * v / mx2}%` })), h("span", { class: "val", text: fmt(v) })));
  el.append(h("div", { class: "grid2" }, a, b));
  if (M.n_nonbids) { const ul = h("ul", { class: "mono small", style: "max-height:220px;overflow:auto;margin:0" }); for (const p of M.nonbids) ul.append(h("li", { text: p })); el.append(h("div", { class: "card", style: "margin-top:14px" }, h("h3", { text: `Outside BIDS naming (${M.n_nonbids})` }), ul)); }
}

if (!M) document.getElementById("main").textContent = "No data embedded.";
else mount();
</script>
