<!doctype html>
<html lang="en" data-theme="dark" data-density="dense">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="dashboard-page" content="agent-dashboard 2.5.2">
<title>Agents</title>
<!-- dashboard-builder page 2.5.2. Fixed, versioned page; data arrives through window.__hub
     (file mode: data.js) or GET /api/hub (server mode). Fonts: Geist and Geist Mono,
     SIL Open Font License 1.1 (assets/fonts/OFL-Geist.txt), embedded at the end of the body. -->
<style>
:root{
  --accent:#6366f1; --accent-ink:#a5a8ff; --accent-btn:#5053d6; --on-accent:#fff;
  --font:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --r-lg:10px;
  --ease:cubic-bezier(.16,1,.3,1);
  --top-h:48px;
  /* type scale */
  --ts-1:11px; --ts-2:12px; --ts-3:13px; --ts-4:15px; --ts-5:18px; --ts-6:24px; --ts-7:36px;
}
:root,[data-theme=dark]{
  color-scheme:dark;
  --bg:#0b0c0f; --rail:#0e1014; --surface:#13151a; --surface-2:#191c22; --surface-3:#20242b;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13); --line-3:rgba(255,255,255,.2);
  --fg:#ececef; --fg-2:#a6abb6; --fg-3:#80869a;
  --ok:#4cc46f; --warn:#e9b64c; --serious:#f08c4f; --bad:#f36d6d; --paused:#94a3ff; --idle:#8a90a0;
  --warn-bg:rgba(233,182,76,.075); --warn-line:rgba(233,182,76,.28); --warn-ink:#e9b64c;
  --bad-bg:rgba(243,109,109,.08);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  --sel:rgba(99,102,241,.35);
}
[data-theme=light]{
  color-scheme:light;
  --bg:#f6f6f4; --rail:#efefec; --surface:#ffffff; --surface-2:#f6f6f3; --surface-3:#ececea;
  --line:rgba(17,20,28,.085); --line-2:rgba(17,20,28,.14); --line-3:rgba(17,20,28,.24);
  --fg:#15171c; --fg-2:#4a505b; --fg-3:#646a76;
  --ok:#1b7a37; --warn:#8f5c00; --serious:#b1470f; --bad:#c42b2b; --paused:#4150c4; --idle:#5f6470;
  --warn-bg:rgba(214,150,20,.08); --warn-line:rgba(170,110,0,.3); --warn-ink:#6b4400;
  --bad-bg:rgba(196,43,43,.06);
  --shadow:0 1px 2px rgba(17,20,28,.05), 0 8px 24px -14px rgba(17,20,28,.18);
  --sel:rgba(99,102,241,.22);
}
[data-density=dense]{ --fs:var(--ts-3); --fs-s:var(--ts-2); --fs-xs:var(--ts-1); --gap:12px; --pad:16px; --row:26px; --lh:1.45; }
[data-density=airy]{ --fs:var(--ts-3); --fs-s:var(--ts-2); --fs-xs:var(--ts-1); --gap:16px; --pad:22px; --row:32px; --lh:1.6; }

*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--fg); font:400 var(--fs)/var(--lh) var(--font);
  font-feature-settings:"ss01","cv11"; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; min-height:100vh}
::selection{background:var(--sel); color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px; border-radius:4px}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0; text-align:inherit}
button:disabled{cursor:not-allowed}
a{color:var(--accent-ink); text-underline-offset:3px; text-decoration-thickness:1px; text-decoration-color:color-mix(in oklab,var(--accent-ink) 45%,transparent)}
a:hover{text-decoration-color:currentColor}
code,.mono{font-family:var(--mono); font-size:.93em; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.soft{color:var(--fg-2)}
.sr-only{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.ic{width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px}
.ic.sm{width:14px; height:14px}
.ic.xs{width:12px; height:12px; vertical-align:-2px}
.ell{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
*{scrollbar-width:thin; scrollbar-color:var(--line-3) transparent}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:10px; border:3px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--line-3)}

/* ---------- top bar ---------- */
.top{position:sticky; top:0; z-index:20; height:var(--top-h); display:flex; align-items:center; gap:18px; padding:0 var(--pad);
  background:color-mix(in oklab,var(--bg) 88%,transparent); backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{width:22px; height:22px; flex:none; color:var(--accent-ink); stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.proj{font-weight:600; font-size:var(--ts-4); letter-spacing:-.01em; white-space:nowrap}
.git{display:flex; align-items:center; gap:8px; color:var(--fg-2); font-size:var(--fs-s); min-width:0}
.git .ell{max-width:220px}
.chip{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:999px; border:1px solid var(--line-2); font-size:var(--fs-xs); color:var(--fg-2); white-space:nowrap; background:var(--surface)}
.chip.warn{color:var(--warn); border-color:var(--warn-line); background:var(--warn-bg)}
.tally{display:flex; align-items:center; gap:14px; font-size:var(--fs-s); color:var(--fg-2); margin-left:auto}
.tally > span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.tally .tl-l{margin-left:-2px}
.conn{display:flex; align-items:center; gap:8px; font-size:var(--fs-s); color:var(--fg-2); white-space:nowrap}
.clock{font-family:var(--mono); font-size:var(--fs-s); color:var(--fg-3); font-variant-numeric:tabular-nums}
.iconbtn{width:32px; height:32px; display:inline-grid; place-items:center; border-radius:var(--r); color:var(--fg-2); flex:none}
.iconbtn:hover{background:var(--surface-2); color:var(--fg)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--c,var(--idle)); flex:none; display:inline-block; position:relative}
.dot.live::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--c); opacity:0; animation:ping 2.2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.5); opacity:.7}80%,100%{transform:scale(1.35); opacity:0}}

/* ---------- banners & needs ---------- */
.banner{display:flex; gap:10px; align-items:flex-start; padding:10px var(--pad); font-size:var(--fs-s); border-bottom:1px solid var(--line); color:var(--fg)}
.banner.warn{background:var(--warn-bg); border-color:var(--warn-line)}
.banner.bad{background:var(--bad-bg)}
.banner .ic{margin-top:2px}
.banner.warn .ic{color:var(--warn)} .banner.bad .ic{color:var(--bad)}
.needs{border-bottom:1px solid var(--warn-line); background:linear-gradient(var(--warn-bg),var(--warn-bg)),var(--bg); padding:14px var(--pad) 16px}
.needs.compact{background:var(--bg); border-bottom-color:var(--line); padding:10px var(--pad) 12px}
.needs.compact .needs-h{font-size:var(--ts-3); margin-bottom:8px}
.needs.compact .needs-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.needs-h{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:var(--ts-4); font-weight:600}
.needs-h .ic{color:var(--warn)}
.needs-h .n{font-variant-numeric:tabular-nums; color:var(--warn); font-weight:600}
.needs-grid{align-items:stretch; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr)); gap:8px}
.need{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 10px; padding:10px 12px 10px 14px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line); box-shadow:inset 3px 0 0 var(--c),var(--shadow); min-width:0}
.need.is-answered{box-shadow:inset 3px 0 0 var(--line-3)}
.need.is-answered .need-text{color:var(--fg-2)}
.need-ic{width:26px; height:26px; border-radius:7px; display:grid; place-items:center; color:var(--c); background:color-mix(in oklab,var(--c) 14%,transparent); grid-row:span 3}
.need-top{display:flex; align-items:center; gap:8px; min-width:0; font-size:var(--fs-xs); color:var(--fg-3)}
.need-top .who{display:inline-flex; align-items:center; gap:6px; min-height:26px; color:var(--fg-2); font-weight:500; min-width:0; border-radius:4px}
.need-top .who:hover{color:var(--fg)}
.need-top time{margin-left:auto; white-space:nowrap}
.need-kind{color:var(--c); font-weight:600; white-space:nowrap}
.need-text{font-weight:500; overflow-wrap:anywhere}
.need-sub{font-size:var(--fs-s); color:var(--fg-2); overflow-wrap:anywhere}
.need-sub code{color:var(--fg)}
.need > :not(.need-ic){grid-column:2; min-width:0}
.need-act{grid-column:2; display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:4px}
.need-act .field{flex:1 1 220px}
.needs-more{display:none!important}

/* ---------- shell ---------- */
.shell{--lw:288px; --rw:312px; display:grid; grid-template-columns:var(--lw) minmax(0,1fr) var(--rw); align-items:start; min-height:calc(100vh - var(--top-h));
  background:linear-gradient(90deg,var(--rail) calc(var(--lw) - 1px),var(--line) calc(var(--lw) - 1px) var(--lw),transparent var(--lw)),
    linear-gradient(270deg,var(--rail) calc(var(--rw) - 1px),var(--line) calc(var(--rw) - 1px) var(--rw),transparent var(--rw))}
.shell.no-rail{--rw:0px; grid-template-columns:var(--lw) minmax(0,1fr)}
.lanes,.rail{position:sticky; top:var(--top-h); max-height:calc(100vh - var(--top-h)); overflow:auto}
.lanes{padding:12px 8px 24px}
.rail{padding:14px var(--pad) 40px; -webkit-mask-image:linear-gradient(#000 calc(100% - 32px),transparent); mask-image:linear-gradient(#000 calc(100% - 32px),transparent)}
.rail-empty{display:none}
.lanes-h{display:flex; align-items:center; justify-content:space-between; padding:2px 8px 8px; font-size:var(--fs-xs); color:var(--fg-3)}
.lanes-h b,.lanes-t{font-weight:600; color:var(--fg-2); font-size:var(--fs-s); margin:0}
#sessions-h:focus,#sess-h:focus{outline:2px solid var(--accent-ink); outline-offset:3px; border-radius:4px}

.lane{display:flex; flex-direction:column; gap:6px; width:100%; padding:10px 10px 11px; border-radius:var(--r-lg); border:1px solid transparent; position:relative; transition:background .15s, border-color .15s}
.lane + .lane{margin-top:2px}
.lane:hover{background:color-mix(in oklab,var(--fg) 4%,transparent)}
.lane.is-sel:hover{background:color-mix(in oklab,var(--accent) 13%,var(--surface))}
.lane.is-sel{background:color-mix(in oklab,var(--accent) 11%,var(--surface)); border-color:color-mix(in oklab,var(--accent) 30%,var(--line)); box-shadow:inset 2px 0 0 var(--accent-ink),var(--shadow)}
.lane.is-ended,.lane.is-ended .lane-label,.lane.is-ended .lane-state{color:var(--fg-3)}
.lane.is-stale .lane-state{color:var(--fg-3)}
.el.dim,.now-el.dim,.now-foot.dim{opacity:1; color:var(--fg-3)}
.lane-top{display:flex; align-items:center; gap:8px; min-width:0}
.lane-label{font-weight:600; flex:1; min-width:0}
.lane-id{font-size:var(--fs-xs); color:var(--fg-3)}
.lane-state{display:flex; align-items:center; gap:7px; font-size:var(--fs-s); color:var(--c); font-weight:500}
.lane-state .muted{font-weight:400}
.lane-cur{display:flex; align-items:baseline; gap:6px; font-size:var(--fs-xs); color:var(--fg-2); min-width:0}
.lane-cur .tool{color:var(--fg); flex:none; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lane-cur .sum{flex:1}
.lane-cur .el{flex:none; color:var(--fg)}
.lane-foot{display:flex; align-items:center; gap:10px; font-size:var(--fs-xs); color:var(--fg-3); min-width:0}
.lane-foot .segs{flex:1}
.lane-prompt{font-size:var(--fs-xs); color:var(--fg-3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.count{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:999px; font-size:var(--fs-xs); font-weight:600; background:color-mix(in oklab,var(--warn) 18%,transparent); color:var(--warn-ink); font-variant-numeric:tabular-nums}
.agent{width:20px; height:20px; border-radius:6px; display:inline-grid; place-items:center; flex:none; color:var(--ag); background:color-mix(in oklab,var(--ag) 15%,transparent); box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ag) 30%,transparent)}
.agent .ic{width:12px; height:12px; stroke-width:2.2}
.agent.claude{--ag:#d9825b} .agent.codex{--ag:#5fb4c9} .agent.other{--ag:var(--fg-2)}
[data-theme=light] .agent.claude{--ag:#b3552c} [data-theme=light] .agent.codex{--ag:#1f7b91}
.ended-toggle{display:flex; align-items:center; gap:6px; width:100%; padding:10px 10px 6px; font-size:var(--fs-xs); color:var(--fg-3)}
.ended-toggle:hover{color:var(--fg-2)}

/* segmented progress */
.segs{display:flex; gap:2px; height:5px; min-width:40px}
.segs i{flex:1; border-radius:2px; background:var(--line-2)}
.segs i.done{background:color-mix(in oklab,var(--ok) 80%,var(--surface))}
.segs i.doing{background:var(--accent-ink)}
.segs i.blocked{background:var(--bad)}
.segs i.skipped{background:repeating-linear-gradient(135deg,var(--line-2) 0 2px,transparent 2px 4px)}
.segs.big{height:6px}

/* ---------- main ---------- */
.main{min-width:0; padding:18px clamp(16px,2.2vw,28px) 48px}
.main:focus{outline:none}
.pane{container-type:inline-size; min-width:0}
.empty{padding:48px 16px; text-align:center; color:var(--fg-2); max-width:560px; margin:0 auto}
.empty h2{font-size:var(--ts-5); color:var(--fg); margin:12px 0 6px; font-weight:600; letter-spacing:-.01em}
.empty p{margin:0 0 6px}
.sess-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:14px}
.sess-head .agent{width:28px; height:28px; border-radius:8px; margin-top:1px}
.sess-head .agent .ic{width:15px; height:15px}
.sess-title{flex:1; min-width:0}
.sess-title .sess-h{font-size:var(--ts-6); line-height:1.2; font-weight:600; letter-spacing:-.018em; margin:0; overflow-wrap:anywhere; text-wrap:balance}
.sess-meta{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:4px; font-size:var(--fs-s); color:var(--fg-3)}
.sess-meta .mono{color:var(--fg-2); overflow-wrap:anywhere; min-width:0}
.sess-actions{display:flex; gap:6px; flex:none}
.statline{display:flex; flex-wrap:wrap; gap:2px 8px; margin:6px 0 0; font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-3); font-variant-numeric:tabular-nums}
.statline b{color:var(--fg-2); font-weight:500}
.statline .bad b,.statline .bad{color:var(--bad)}
.statline i{font-style:normal; color:var(--line-3)}

.btn{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--surface); color:var(--fg); font-size:var(--fs-s); font-weight:500; white-space:nowrap; transition:background .15s, border-color .15s}
.btn:hover:not(:disabled){background:var(--surface-2); border-color:var(--line-3)}
.btn.primary{background:var(--accent-btn); border-color:transparent; color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:color-mix(in oklab,var(--accent-btn) 88%,white)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--fg-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2); color:var(--fg)}
.btn:disabled,.btn.primary:disabled{background:var(--surface-2); border-color:var(--line); color:var(--fg-3); box-shadow:none}
.btn.sm{height:28px; padding:0 9px; font-size:var(--fs-xs)}
.field{height:30px; padding:0 10px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--bg); min-width:0; font-size:var(--fs-s)}
.field::placeholder,textarea::placeholder{color:var(--fg-3)}
.field:focus,textarea:focus{box-shadow:0 0 0 1px var(--accent-ink)}
textarea:focus-visible,.field:focus-visible{outline:none}
.field:disabled,textarea:disabled{opacity:.6; cursor:not-allowed}

/* now hero */
.now{position:relative; isolation:isolate; display:grid; grid-template-columns:minmax(150px,auto) minmax(0,1fr) auto; gap:6px 22px; align-items:center; padding:16px 18px; border-radius:var(--r-lg);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden; margin-bottom:10px}
.now::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:transparent}
.now-state{display:flex; align-items:center; gap:12px; min-width:0}
.now-dot{width:12px; height:12px}
.now-dot.live::after{inset:-5px}
.now-label{font-size:var(--ts-5); font-weight:600; letter-spacing:-.015em; color:var(--c); line-height:1.2}
.now-since{font-size:var(--fs-s); color:var(--fg-3)}
.now-cur{min-width:0; border-left:1px solid var(--line); padding-left:22px}
.now-tool{display:flex; flex-wrap:wrap; align-items:center; gap:2px 7px; min-width:0; font-size:var(--fs-s); color:var(--fg-2); margin-bottom:3px}
.now-tool b{color:var(--fg); font-weight:600; font-family:var(--mono); font-size:var(--fs-s); min-width:0; overflow-wrap:anywhere}
.now-sum{font-family:var(--mono); font-size:var(--ts-3); color:var(--fg); overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.now-sum.quiet{font-family:var(--font); color:var(--fg-2); display:block; -webkit-line-clamp:unset; overflow:visible}
.now-el{font-family:var(--mono); font-size:var(--ts-7); font-weight:500; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--fg); line-height:1; text-align:right}
.now-el small{display:block; font-family:var(--font); font-size:var(--fs-xs); color:var(--fg-3); letter-spacing:0; font-weight:400; margin-top:6px}
.now-foot{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding-top:12px; margin-top:6px; border-top:1px solid var(--line); font-size:var(--fs-s); color:var(--fg-2)}
.now-foot .pill{font-weight:600; color:var(--c)}
.now-foot .pill.doubt{font-weight:500; color:var(--fg-3)}

/* composer */
.composer{display:flex; gap:8px; align-items:flex-end}
.composer textarea{flex:1; min-height:38px; max-height:180px; resize:none; padding:9px 12px; border-radius:var(--r-lg); border:1px solid var(--line-2); background:var(--surface); line-height:1.45; field-sizing:content}
.composer .btn{height:38px; padding:0 14px}
.hint{display:flex; align-items:flex-start; gap:7px; margin:7px 2px 0; font-size:var(--fs-xs); color:var(--fg-3)}
.hint .ic{margin-top:1px}
.hint code{color:var(--fg-2); background:var(--surface-2); padding:1px 5px; border-radius:4px}
.inbox{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:4px}
.msg{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:baseline; font-size:var(--fs-s); padding:6px 10px; border-radius:var(--r); background:var(--surface-2)}
.msg .who{font-size:var(--fs-xs); color:var(--fg-3)}
.msg .txt{overflow-wrap:anywhere; max-height:7.5em; overflow:auto}
.st{font-size:var(--fs-xs); white-space:nowrap; display:inline-flex; align-items:center; gap:5px; color:var(--fg-3)}
.st.delivered{color:var(--ok)} .st.queued{color:var(--warn)} .st.failed{color:var(--bad)} .st.sending{color:var(--fg-2)}
.composer-wrap{margin-bottom:22px}

/* columns */
.cols{display:grid; grid-template-columns:minmax(0,1fr); gap:22px}
@container (max-width:620px){ .msg{grid-template-columns:auto minmax(0,1fr); row-gap:2px} .msg .st{grid-column:2} }
@container (min-width:780px){ .cols{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); align-items:start} }
.col{display:flex; flex-direction:column; gap:22px; min-width:0}
.panel{min-width:0}
.ph{display:flex; align-items:baseline; gap:8px; margin:0 0 10px}
.ph h3{margin:0; font-size:var(--ts-4); font-weight:600; letter-spacing:-.01em}
.ph .aside{font-weight:400; font-size:var(--fs-xs); color:var(--fg-3); margin-left:auto; white-space:nowrap}
.ph .sub{font-weight:400; font-size:var(--fs-xs); color:var(--fg-3)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg)}
.note{font-size:var(--fs-s); color:var(--fg-3); padding:12px 14px}

/* timeline */
.turn{border-top:1px solid var(--line)}
.turn:first-child{border-top:0}
.turn-h{display:flex; align-items:center; gap:8px; width:100%; padding:10px 12px 6px; font-size:var(--fs-xs); color:var(--fg-3); border-radius:var(--r-lg)}
.turn-h:hover{color:var(--fg-2)}
.turn-h .n{font-weight:600; color:var(--fg-2); font-size:var(--fs-s)}
.turn-h .chev{transition:transform .2s var(--ease)}
.turn.open .turn-h .chev{transform:rotate(90deg)}
.turn-h .bad{color:var(--bad)}
.turn-h .meta{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.turn-h .gap{margin-left:auto; white-space:nowrap}
.prompt{margin:0 12px 8px 34px; padding:0; font-size:var(--fs-s); color:var(--fg); overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.turn.open .prompt{-webkit-line-clamp:6}
.prompt::before{content:"\201C"; color:var(--fg-3)} .prompt::after{content:"\201D"; color:var(--fg-3)}
.evs{list-style:none; margin:0; padding:0 0 8px}
.ev{display:grid; grid-template-columns:max-content 18px minmax(0,1fr) auto; gap:8px; align-items:start; padding:3px 12px; min-height:var(--row); font-size:var(--fs-s)}
.ev:hover{background:var(--surface-2)}
.ev-t{font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-3); padding-top:2px; font-variant-numeric:tabular-nums}
.ev-ic{color:var(--fg-3); padding-top:2px; display:flex}
.ev-b{min-width:0; display:flex; flex-direction:column}
.ev-line{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 7px; min-width:0}
.ev-tool{font-weight:500; color:var(--fg); white-space:nowrap; max-width:min(34ch,100%); overflow:hidden; text-overflow:ellipsis; flex:none}
.ev-sum{font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-2); min-width:0; overflow-wrap:anywhere}
.ev-detail{font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-3); overflow-wrap:anywhere; margin-top:1px}
.ev-d{font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-3); white-space:nowrap; padding-top:2px; font-variant-numeric:tabular-nums}
.ev.fail .ev-ic,.ev.fail .ev-tool{color:var(--bad)}
.ev.fail .ev-detail{color:color-mix(in oklab,var(--bad) 75%,var(--fg-2))}
.ev.sub{padding-left:26px}
.ev.sub .ev-t{visibility:hidden}
.ev .subtag{font-size:var(--fs-xs); color:var(--fg-3); border:1px solid var(--line-2); border-radius:4px; padding:0 4px; white-space:nowrap; max-width:18ch; overflow:hidden; text-overflow:ellipsis; flex:none}
.ev.k-note .ev-ic{color:var(--accent-ink)} .ev.k-note .ev-sum{font-family:var(--font); font-size:var(--fs-s); color:var(--fg)}
.ev.k-message .ev-ic{color:var(--accent-ink)} .ev.k-message .ev-sum{font-family:var(--font); font-size:var(--fs-s); color:var(--fg)}
.ev.k-notify .ev-ic,.ev.k-notify .ev-tool{color:var(--warn)}
.ev.k-notify .ev-sum,.ev.k-test .ev-sum{font-family:var(--font); font-size:var(--fs-s)}
.ev.k-turn_end .ev-sum,.ev.k-session .ev-sum{font-family:var(--font); font-size:var(--fs-s)}
.ev.burst .ev-tool .x{color:var(--fg-3); font-weight:400}
.ev.burst{display:block; padding:0}
.ev.burst:hover{background:none}
.burst-btn{display:grid; grid-template-columns:max-content 18px minmax(0,1fr) auto; gap:8px; align-items:start; width:100%; padding:3px 12px; min-height:var(--row); font-size:var(--fs-s); text-align:left; border-radius:4px}
.burst-btn:hover{background:var(--surface-2)}
.burst-btn .chev{transition:transform .2s var(--ease)}
.burst-btn[aria-expanded=true] .chev{transform:rotate(90deg)}
.burst-list .bd{margin-left:auto; color:var(--fg-3); padding-right:12px}
.burst-list{grid-column:3/-1; list-style:none; margin:4px 0 2px; padding:0 0 0 10px; border-left:1px solid var(--line-2)}
.burst-list li{display:flex; gap:8px; font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-2); padding:1px 0}
.burst-list li time{color:var(--fg-3)}
.ev.is-new{animation:evin .5s var(--ease)}
@keyframes evin{from{opacity:0; transform:translateY(-4px); background:color-mix(in oklab,var(--accent) 12%,transparent)}}
.more{display:block; width:100%; padding:8px 12px; font-size:var(--fs-xs); color:var(--fg-3); text-align:left; border-top:1px solid var(--line)}
.more:hover{color:var(--fg)}

/* plan */
.plan-card{padding:14px 14px 10px}
.plan-top{display:flex; align-items:flex-start; gap:10px}
.plan-top h4{margin:0; font-size:var(--fs); font-weight:600; flex:1; min-width:0; overflow-wrap:anywhere}
.status{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); font-weight:600; color:var(--c); white-space:nowrap; height:20px; padding:0 8px; border-radius:999px; background:color-mix(in oklab,var(--c) 13%,transparent)}
.goal{font-size:var(--fs-s); color:var(--fg-2); margin:4px 0 0; overflow-wrap:anywhere}
.status-note{font-size:var(--fs-s); margin:8px 0 0; overflow-wrap:anywhere}
.prog{display:flex; align-items:center; gap:10px; margin:12px 0 6px; font-size:var(--fs-xs); color:var(--fg-3)}
.prog .segs{flex:1}
.tasks{list-style:none; margin:0; padding:0}
.task{display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:8px; padding:5px 0; font-size:var(--fs-s); align-items:start}
.task + .task{border-top:1px solid var(--line)}
.task .ic{color:var(--fg-3); margin-top:1px}
.task.done .ic{color:var(--ok)} .task.doing .ic{color:var(--accent-ink)} .task.blocked .ic{color:var(--bad)}
.task.done .t{color:var(--fg-2)} .task.skipped .t{color:var(--fg-3); text-decoration:line-through; text-decoration-color:var(--line-3)}
.task.doing .t{font-weight:600}
.task .n{display:block; font-size:var(--fs-xs); color:var(--fg-3); overflow-wrap:anywhere}
.task .d{font-size:var(--fs-xs); color:var(--fg-3); white-space:nowrap; font-variant-numeric:tabular-nums}
.decisions{margin-top:10px; padding-top:8px; border-top:1px solid var(--line)}
.decision{font-size:var(--fs-s); padding:3px 0; overflow-wrap:anywhere}
.decision .q{color:var(--fg-2)}
.log{list-style:none; margin:8px 0 0; padding:8px 0 0; border-top:1px solid var(--line)}
.log li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px; font-size:var(--fs-s); padding:2px 0}
.log li span,.task .t,.task .n,.goal,.status-note,.decision,.now-foot span,.bead .t,.post .x,.need-text,.need-sub{overflow-wrap:anywhere}
.log time{font-size:var(--fs-xs); color:var(--fg-3); white-space:nowrap; padding-top:1px}
.sub-h{font-size:var(--fs-xs); color:var(--fg-3); margin:0 0 4px; font-weight:500}

/* tests + metrics */
.tests-card{padding:12px 14px}
.tests-top{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.tests-big{font-size:var(--ts-6); font-weight:600; letter-spacing:-.02em}
.tests-big.bad{color:var(--bad)} .tests-big.ok{color:var(--ok)}
.tests-top .soft{font-size:var(--fs-s)}
.tests-cmd{font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-3); margin-top:2px}
.bars{display:block; width:100%; margin-top:12px; overflow:visible}
.bars text{font-family:var(--mono); font-size:var(--ts-1); fill:var(--fg-2)}
.bars rect.f{fill:var(--bad)} .bars rect.z{fill:var(--ok); opacity:.7} .bars rect.u{fill:none; stroke:var(--fg-3); stroke-dasharray:2 2; stroke-width:1} .bars line{stroke:var(--line-2)}
.bars-cap{display:flex; justify-content:space-between; font-size:var(--fs-xs); color:var(--fg-3); margin-top:2px}
.mini{display:inline-block; vertical-align:middle}
.mini rect.f{fill:var(--bad)} .mini rect.z{fill:var(--ok); opacity:.65} .mini rect.u{fill:none; stroke:var(--fg-3); stroke-width:1}
.metrics{list-style:none; margin:0; padding:0}
.metric{display:grid; grid-template-columns:minmax(0,1fr) auto 88px; gap:4px 12px; align-items:center; padding:9px 14px}
.metric + .metric{border-top:1px solid var(--line)}
.metric .nm{font-size:var(--fs-s); color:var(--fg-2); min-width:0}
.metric .v{font-size:var(--ts-4); font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; letter-spacing:-.01em}
.metric .v small{font-size:var(--fs-xs); color:var(--fg-3); font-weight:400}
.metric .v.unk{color:var(--fg-3); font-weight:500}
.metric .delta{grid-column:1/3; font-size:var(--fs-xs); color:var(--fg-3)}
.metric .delta .good{color:var(--ok)} .metric .delta .bad{color:var(--bad)}
.metric svg{grid-row:1/3; grid-column:3; width:88px; height:28px; overflow:visible}
.spark path{fill:none; stroke:var(--fg-2); stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round}
.spark circle{fill:var(--fg)}
.spark .base{stroke:var(--line-2); stroke-width:1; stroke-dasharray:2 3}

/* files */
.files{list-style:none; margin:0; padding:4px 0}
.file{display:grid; grid-template-columns:minmax(0,1fr) 96px max-content 56px; gap:10px; align-items:center; min-height:28px; padding:3px 14px; font-size:var(--fs-s)}
.file + .file{border-top:1px solid var(--line)}
.file .p{display:flex; align-items:center; gap:4px; font-family:var(--mono); font-size:var(--fs-xs); min-width:0}
.file .pt{direction:rtl; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.file .p .dir{color:var(--fg-3)}
.file .p .ic{color:var(--warn); flex:none}
.heat{display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--line)}
.heat i{display:block; height:100%}
.heat i.e{background:var(--accent-ink)} .heat i.r{background:var(--line-3)}
.file .c{font-size:var(--fs-xs); white-space:nowrap; font-variant-numeric:tabular-nums; text-align:right; color:var(--fg-3)}
.file .ce{color:var(--fg-2)}
.file .fa{font-size:var(--fs-xs); color:var(--fg-3); white-space:nowrap; text-align:right}
@container (max-width:1000px){ .file{grid-template-columns:minmax(0,1fr) 40px max-content 48px; gap:8px} }
.ev-sum.ell{flex:1 1 10ch}
.legend{display:flex; gap:12px; font-size:var(--fs-xs); color:var(--fg-3)}
.legend .le{background:var(--accent-ink)} .legend .lr{background:var(--line-3)}
.legend i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:0}

/* deliverables */
.dl{list-style:none; margin:0; padding:4px 0}
.dl li{display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:8px; padding:7px 14px; align-items:start}
.dl li + li{border-top:1px solid var(--line)}
.dl .ic{color:var(--fg-3); margin-top:2px}
.dl a{font-weight:500}
.dl .path{display:block; font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-3); overflow-wrap:anywhere}
.dl .nt{display:block; font-size:var(--fs-xs); color:var(--fg-2)}

/* rail */
.rs + .rs{margin-top:22px}
.rs-h{display:flex; align-items:baseline; gap:8px; font-size:var(--ts-4); font-weight:600; margin:0 0 10px}
.rs-h .aside{margin-left:auto; font-size:var(--fs-xs); color:var(--fg-3); font-weight:400; white-space:nowrap}
.sessref{display:inline-flex; align-items:center; gap:5px; min-height:26px; padding:0 7px 0 3px; border-radius:6px; background:var(--surface-2); font-size:var(--fs-xs); color:var(--fg-2); max-width:100%}
.sessref:hover{color:var(--fg); background:var(--surface-3)}
.sessref .agent{width:16px; height:16px; border-radius:4px}
.sessref .agent .ic{width:10px; height:10px}
.counts{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface); margin-bottom:12px}
.counts div{padding:7px 10px; border-right:1px solid var(--line)}
.counts div:last-child{border-right:0}
.counts b{display:block; font-size:var(--ts-4); font-weight:600; font-variant-numeric:tabular-nums}
.counts span{font-size:var(--fs-xs); color:var(--fg-3)}
.beads{list-style:none; margin:0 0 12px; padding:0}
.bead{display:grid; grid-template-columns:auto minmax(0,1fr); gap:1px 8px; padding:5px 0; font-size:var(--fs-s)}
.bead + .bead{border-top:1px solid var(--line)}
.bead .id{font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-3); padding-top:1px}
.bead .t{min-width:0; overflow-wrap:anywhere}
.bead .m{grid-column:2; font-size:var(--fs-xs); color:var(--fg-3)}
.bead .pr{font-family:var(--mono)}
.grp-h{display:flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--fg-2); font-weight:600; margin:0 0 2px}
.grp-h .dot{width:6px; height:6px}
.res-list,.actors,.posts{list-style:none; margin:0 0 12px; padding:0}
.res-list li{font-size:var(--fs-s); padding:4px 0}
.res-list li + li{border-top:1px solid var(--line)}
.res-list .paths{font-family:var(--mono); font-size:var(--fs-xs); color:var(--fg-2); overflow-wrap:anywhere}
.res-list .m{font-size:var(--fs-xs); color:var(--fg-3)}
.actors{display:flex; flex-wrap:wrap; gap:4px}
.actors li{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--fg-2); padding:2px 8px 2px 6px; border-radius:999px; border:1px solid var(--line)}
.actors .dot{width:6px; height:6px}
.post{padding:7px 0}
.post + .post{border-top:1px solid var(--line)}
.post .m{display:flex; gap:6px; font-size:var(--fs-xs); color:var(--fg-3); flex-wrap:wrap}
.post .m b{color:var(--fg-2); font-weight:500}
.post .x{font-size:var(--fs-s); margin-top:2px; overflow-wrap:anywhere}
.topic{font-family:var(--mono); color:var(--accent-ink)}
.post-form{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.post-form textarea{min-height:56px; resize:vertical; padding:8px 10px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--bg); font-size:var(--fs-s)}
.post-form .row{display:flex; gap:6px}
.post-form .row .field{flex:1}
.err{font-size:var(--fs-s); color:var(--bad); overflow-wrap:anywhere}

/* keys overlay */
.keys{position:fixed; right:16px; bottom:16px; z-index:40; width:min(320px,calc(100vw - 32px)); padding:14px 16px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line-2); box-shadow:0 18px 50px -12px rgba(0,0,0,.45)}
.keys h2{font-size:var(--fs); margin:0 0 8px; font-weight:600; display:flex; justify-content:space-between; align-items:center}
.keys dl{display:grid; grid-template-columns:72px 1fr; gap:6px 14px; margin:0; font-size:var(--fs-s)}
.keys dd{margin:0; color:var(--fg-2)}
kbd{font-family:var(--mono); font-size:var(--fs-xs); min-width:20px; height:20px; padding:0 5px; display:inline-grid; place-items:center; border-radius:4px; border:1px solid var(--line-2); border-bottom-width:2px; background:var(--surface-2); color:var(--fg)}

/* skeleton */
.skel{display:block; height:12px; border-radius:4px; background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2)); background-size:200% 100%; animation:sk 1.6s linear infinite; margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- r1 additions ---------- */
.skip{position:absolute; left:12px; top:-60px; z-index:50; padding:8px 12px; border-radius:var(--r); background:var(--accent-btn); color:var(--on-accent); font-weight:600; text-decoration:none}
.skip:focus{top:10px}
[data-theme=light] .needs:not(.compact){background:var(--surface-2); border-bottom-color:var(--line-2)}
.need-tally{color:var(--warn-ink)}
.need-tally b{color:var(--warn-ink)}
.tally > span > span{margin-left:-2px}
.danger{display:flex; gap:7px; align-items:flex-start; margin:6px 0 0; padding:6px 9px; border-radius:var(--r); background:var(--bad-bg); color:var(--bad); font-size:var(--fs-s); grid-column:2; overflow-wrap:anywhere}
.danger .ic{margin-top:2px}
.danger b{font-weight:600}
.need-sub.answered{display:flex; gap:6px; align-items:center; color:var(--fg-2)}
.need-sub.answered .ic{color:var(--ok)}
.live-tag,.old-tag{display:inline-block; font-size:var(--fs-xs); font-weight:600; padding:0 6px; border-radius:999px; margin-right:4px}
.live-tag{color:var(--serious); background:color-mix(in oklab,var(--serious) 14%,transparent)}
.old-tag{color:var(--fg-3); background:var(--surface-2)}
.parties{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; grid-column:2}
.parties li{display:grid; grid-template-columns:minmax(0,11.5rem) minmax(0,1fr); align-items:center; gap:2px 10px; font-size:var(--fs-s); min-width:0}
.parties li + li{padding-top:4px; border-top:1px solid var(--line)}
.parties .pa{grid-column:2}
.parties .sessref{justify-self:start}
.parties .pw{color:var(--fg-2); min-width:0; overflow-wrap:anywhere}
.parties .pa{display:inline-flex; gap:4px}
.now-k{color:var(--accent-ink); font-weight:600}
[data-theme=dark] .now::after{content:""; position:absolute; z-index:-1; inset:-40% 40% 20% -10%; background:radial-gradient(closest-side,color-mix(in oklab,var(--accent) 10%,transparent),transparent); pointer-events:none}
.now.is-stale .now-label{color:var(--fg-2)}
.asof{font-size:var(--fs-xs); font-weight:500; color:var(--fg-3); margin-left:8px; letter-spacing:0}
.now-deliv{grid-column:1/-1; border-top:1px solid var(--line); padding-top:10px; margin-top:2px}
.now-deliv ul{list-style:none; margin:0; padding:0}
.now-deliv li{display:grid; grid-template-columns:18px minmax(8rem,auto) minmax(0,1fr) minmax(0,auto) auto; gap:4px 12px; align-items:center; min-width:0; min-height:32px; padding:2px 0}
.now-deliv li + li{border-top:1px solid var(--line)}
.dl-p{direction:rtl; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-xs); color:var(--fg-3); min-width:0}
.dl-n{font-size:var(--fs-xs); color:var(--fg-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.now-deliv li .ic{color:var(--fg-3); margin-top:2px}
.dl-main{display:flex; flex-direction:column; min-width:0; flex:1; overflow-wrap:anywhere}

.linkbtn{color:var(--accent-ink); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; text-decoration-color:color-mix(in oklab,var(--accent-ink) 45%,transparent); font-weight:500; text-align:left; overflow-wrap:anywhere}
.linkbtn:hover{text-decoration-color:currentColor}
.pause-note{display:flex; align-items:center; gap:8px; margin:-4px 0 10px; padding:8px 10px; border-radius:var(--r); background:var(--bad-bg); color:var(--fg); font-size:var(--fs-s)}
.pause-note .ic{color:var(--bad)}
.pause-note .btn{margin-left:auto}
.size{margin-left:auto; padding-left:8px; color:var(--warn-ink); white-space:nowrap}
.size.over{color:var(--bad); white-space:normal}
.hint .size-slot{margin-left:auto}
.plan-status{display:inline-flex; gap:6px; align-items:center; font-size:var(--fs-xs); white-space:nowrap}
.plan-status .pill{font-weight:600; color:var(--c)}
.pill.doubt{font-weight:500!important; color:var(--fg-3)!important}
.tests-line{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:10px 14px; font-size:var(--fs-s)}
.tests-line > .ic{color:var(--ok)}
.tests-line b{color:var(--ok); font-weight:600}
.tests-line .tests-cmd{flex-basis:100%; margin:0 0 0 26px}
.toggle{display:flex; align-items:center; gap:8px; font-size:var(--fs-s); margin:0 0 10px}
.toggle input{accent-color:var(--accent)}
.keys dl + dl{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.keys dl.off{opacity:1; color:var(--fg-3)}
.keys dl.off dd{color:var(--fg-3)}
@media (min-width:1000px){ .need.k-conflict{grid-column:span 2} }
/* r2: brief (since you left + needs), lanes as comparison rows, hero needs */
.brief{border-bottom:1px solid var(--line)}
.brief.alarm{border-bottom-color:var(--warn-line)}
.brief > .needs{border-bottom:0}
